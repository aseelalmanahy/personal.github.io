<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'sha256-o5hwM8LuGJgme0+9SQU9LhpqrQNaCZwA1qLTm5oKRwE='; style-src 'self'; img-src 'self'; manifest-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <base href="/" />
    <title>Page not found — Aseel Almanahy</title>
    <script>
      (() => {
        const root = document.documentElement;
        root.classList.replace('no-js', 'js');
        try {
          const theme = localStorage.getItem('theme');
          if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
        } catch {
          // Storage can be blocked; the page then follows the device preference.
        }
      })();
    </script>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/print.css" media="print" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#FBF6EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B1310" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="site-header">
      <div class="container site-header__inner">
        <a class="site-header__brand" href="./">Aseel Almanahy</a>
      </div>
    </header>
    <main id="main" class="not-found" tabindex="-1">
      <div class="container">
        <h1 class="not-found__title">Page not found</h1>
        <p class="not-found__text">
          Sorry — the page you were looking for doesn't exist or has moved.
        </p>
        <p>
          <a class="button button--primary" href="./">Back to the home page</a>
        </p>
      </div>
    </main>
    <footer class="site-footer">
      <div class="container">
        <p>© 2026 Aseel Almanahy</p>
      </div>
    </footer>
  </body>
</html>
